<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anaesthesia Vault</title>
<meta name="description" content="Offline exam-prep notes and study planner for FCPS Anaesthesia — Written, Viva, OSPE, Long &amp; Short Case.">
<meta name="theme-color" content="#0A1622">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Lato:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Anaesthesia Vault — design tokens
   Multiple named themes. Default: "icu" (ICU vital-signs monitor).
   Each theme defines surfaces, text, five accents, and the text
   colour that sits ON each accent (--on-*).
   ============================================================ */

:root,
[data-theme="icu"]{
  --bg:#0A1622; --bg-elevated:#0F2033; --bg-card:#12283F; --bg-sidebar:#081320; --line:#1C3A54;
  --text:#E8F1F8; --text-dim:#8FAEC4; --text-faint:#587489;
  --ecg:#39FF88; --spo2:#22D3EE; --art:#FB5F76; --resp:#FFD166; --violet:#B79CFF;
  --on-ecg:#04140C; --on-spo2:#04202A; --on-art:#2A0A10; --on-resp:#2A2205; --on-violet:#150A2E;
  --dot-color:var(--line);
  --shadow-card: 0 1px 0 rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}

[data-theme="midnight"]{
  --bg:#0E0B1F; --bg-elevated:#171233; --bg-card:#1E1842; --bg-sidebar:#0A0818; --line:#2E2660;
  --text:#EDE9FF; --text-dim:#A99FD6; --text-faint:#6F65A8;
  --ecg:#5EE7B7; --spo2:#7DD3FC; --art:#F472B6; --resp:#FCD34D; --violet:#C4B5FD;
  --on-ecg:#06201A; --on-spo2:#05202E; --on-art:#2A0A18; --on-resp:#2A2205; --on-violet:#1A0B33;
  --dot-color:var(--line);
  --shadow-card: 0 1px 0 rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.65);
}

[data-theme="carbon"]{
  --bg:#0C0C0D; --bg-elevated:#141416; --bg-card:#1B1B1E; --bg-sidebar:#08080A; --line:#2C2C31;
  --text:#F2F1EE; --text-dim:#A8A6A1; --text-faint:#6E6C68;
  --ecg:#F59E0B; --spo2:#38BDF8; --art:#EF4444; --resp:#FDE047; --violet:#A78BFA;
  --on-ecg:#1A1000; --on-spo2:#04202E; --on-art:#FFFFFF; --on-resp:#2A2205; --on-violet:#1A0B33;
  --dot-color:var(--line);
  --shadow-card: 0 1px 0 rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
}

[data-theme="paper"]{
  --bg:#F5F3EC; --bg-elevated:#FFFFFF; --bg-card:#FFFFFF; --bg-sidebar:#EFEBDD; --line:#DCD5C0;
  --text:#1B2430; --text-dim:#566172; --text-faint:#8B96A5;
  --ecg:#0FA45C; --spo2:#0E90A8; --art:#D6425A; --resp:#B5820A; --violet:#7E5FD9;
  --on-ecg:#FFFFFF; --on-spo2:#FFFFFF; --on-art:#FFFFFF; --on-resp:#FFFFFF; --on-violet:#FFFFFF;
  --dot-color:transparent;
  --shadow-card: 0 1px 0 rgba(0,0,0,.03), 0 8px 20px -14px rgba(0,0,0,.25);
}

[data-theme="citrus"]{
  --bg:#FFF9F0; --bg-elevated:#FFFFFF; --bg-card:#FFFFFF; --bg-sidebar:#FFEFD9; --line:#F3D9B5;
  --text:#2A1D0E; --text-dim:#7A6446; --text-faint:#A8916E;
  --ecg:#EA580C; --spo2:#0891B2; --art:#DB2777; --resp:#CA8A04; --violet:#7C3AED;
  --on-ecg:#FFFFFF; --on-spo2:#FFFFFF; --on-art:#FFFFFF; --on-resp:#FFFFFF; --on-violet:#FFFFFF;
  --dot-color:transparent;
  --shadow-card: 0 1px 0 rgba(0,0,0,.03), 0 8px 20px -14px rgba(180,110,30,.3);
}

[data-theme="mint"]{
  --bg:#F0FBF6; --bg-elevated:#FFFFFF; --bg-card:#FFFFFF; --bg-sidebar:#DFF5EA; --line:#BFE6D4;
  --text:#10241B; --text-dim:#4A6B5C; --text-faint:#7C9A8B;
  --ecg:#0D9488; --spo2:#0369A1; --art:#E11D48; --resp:#B45309; --violet:#6D28D9;
  --on-ecg:#FFFFFF; --on-spo2:#FFFFFF; --on-art:#FFFFFF; --on-resp:#FFFFFF; --on-violet:#FFFFFF;
  --dot-color:transparent;
  --shadow-card: 0 1px 0 rgba(0,0,0,.03), 0 8px 20px -14px rgba(13,148,136,.3);
}

[data-theme="blossom"]{
  --bg:#FDF4FB; --bg-elevated:#FFFFFF; --bg-card:#FFFFFF; --bg-sidebar:#F8E4F4; --line:#EBCCE6;
  --text:#2A1026; --text-dim:#6E4A68; --text-faint:#9B7A96;
  --ecg:#C026D3; --spo2:#2563EB; --art:#E11D48; --resp:#A16207; --violet:#7C3AED;
  --on-ecg:#FFFFFF; --on-spo2:#FFFFFF; --on-art:#FFFFFF; --on-resp:#FFFFFF; --on-violet:#FFFFFF;
  --dot-color:transparent;
  --shadow-card: 0 1px 0 rgba(0,0,0,.03), 0 8px 20px -14px rgba(192,38,211,.28);
}

:root{
  --radius-s: 6px;
  --radius-m: 10px;
  --radius-l: 16px;
  --font-ui:   'Plus Jakarta Sans', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --note-font: 'Plus Jakarta Sans', system-ui, sans-serif;
  --note-size: 14.5px;
  --note-weight: 400;
}

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  font-family:var(--font-ui);
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(circle at 1px 1px, var(--dot-color) 1px, transparent 0);
  background-size: 28px 28px;
  background-attachment: fixed;
}
button{ font-family:inherit; }
input,textarea,select{ font-family:inherit; }

.app{
  display:grid;
  grid-template-columns: 260px 1fr;
  height:100vh;
  overflow:hidden;
}
@media (max-width: 760px){
  .app{ grid-template-columns: 1fr; }
  .sidebar{
    position:fixed; z-index:40; inset:0 30% 0 0;
    transform:translateX(-105%);
    transition:transform .22s ease;
  }
  .sidebar.open{ transform:translateX(0); }
  .scrim{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:35; }
  .scrim.show{ display:block; }
}

/* ---------- Sidebar ---------- */
.sidebar{
  background:var(--bg-sidebar);
  border-right:1px solid var(--line);
  display:flex; flex-direction:column;
  overflow-y:auto;
}
.brand{
  display:flex; align-items:center; gap:10px;
  padding:18px 16px 14px;
}
.brand .pulse{
  width:30px; height:30px; flex:none;
}
.brand h1{
  font-size:15px; font-weight:800; margin:0; letter-spacing:.2px;
  line-height:1.2;
}
.brand span{ display:block; font-size:10.5px; color:var(--text-faint); font-family:var(--font-mono); }

.side-section{ padding:10px 12px; }
.side-label{
  font-size:11px; color:var(--text-faint); font-weight:700;
  padding:10px 8px 6px; display:flex; align-items:center; justify-content:space-between;
}
.side-btn{
  display:flex; align-items:center; gap:10px; width:100%;
  background:none; border:none; color:var(--text-dim);
  padding:8px 8px; border-radius:var(--radius-s); cursor:pointer;
  font-size:13.5px; text-align:left;
}
.side-btn svg{ flex:none; opacity:.85; }
.side-btn:hover{ background:var(--bg-card); color:var(--text); }
.side-btn.active{ background:var(--bg-card); color:var(--text); box-shadow: inset 3px 0 0 var(--ecg); }
.side-btn .count{ margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--text-faint); }

.folder-row{ display:flex; align-items:center; gap:6px; }
.folder-row .side-btn{ flex:1; }
.folder-dot{ width:9px; height:9px; border-radius:50%; flex:none; }
.icon-btn{
  background:none; border:none; color:var(--text-faint); cursor:pointer;
  padding:4px; border-radius:6px; display:flex;
}
.icon-btn:hover{ background:var(--bg-card); color:var(--text); }

.tag-chip{
  display:inline-flex; align-items:center; gap:6px;
  font-size:11.5px; padding:4px 9px; border-radius:100px;
  background:var(--bg-card); color:var(--text-dim); border:1px solid var(--line);
  cursor:pointer; margin:0 6px 6px 0;
}
.tag-chip.active{ border-color:var(--spo2); color:var(--spo2); }
.tag-wrap{ display:flex; flex-wrap:wrap; padding:4px 8px; }

.sidebar-footer{
  margin-top:auto; padding:12px; border-top:1px solid var(--line);
  display:flex; gap:8px;
}

/* ---------- Main ---------- */
.main{ display:flex; flex-direction:column; min-width:0; }
.topbar{
  display:flex; align-items:center; gap:10px;
  padding:14px 20px; border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, var(--bg-elevated), transparent);
}
.menu-toggle{ display:none; }
@media (max-width:760px){ .menu-toggle{ display:flex; } }

.search-box{
  flex:1; display:flex; align-items:center; gap:8px;
  background:var(--bg-card); border:1px solid var(--line);
  border-radius:100px; padding:9px 14px; max-width:520px;
}
.search-box input{
  background:none; border:none; outline:none; color:var(--text);
  font-size:13.5px; width:100%;
}
.search-box svg{ color:var(--text-faint); flex:none; }

.btn{
  border:none; cursor:pointer; border-radius:var(--radius-s);
  font-weight:700; font-size:13px; padding:9px 14px;
  display:inline-flex; align-items:center; gap:7px;
}
.btn-primary{ background:var(--ecg); color:var(--on-ecg); }
.btn-primary:hover{ filter:brightness(1.08); }
.btn-ghost{ background:var(--bg-card); color:var(--text); border:1px solid var(--line); }
.btn-ghost:hover{ background:var(--bg-elevated); }
.theme-toggle{
  background:var(--bg-card); border:1px solid var(--line); color:var(--text-dim);
  width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  cursor:pointer;
}

.content{ flex:1; overflow-y:auto; padding:20px; }
.section-title{
  font-size:20px; font-weight:800; margin:4px 0 4px;
  display:flex; align-items:center; gap:10px;
}
.section-sub{ color:var(--text-faint); font-size:12.5px; margin:0 0 16px; font-family:var(--font-mono); }

.grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:14px;
}

.note-card{
  background:var(--bg-card); border:1px solid var(--line);
  border-radius:var(--radius-m); box-shadow:var(--shadow-card);
  padding:14px 14px 10px; cursor:pointer; position:relative;
  border-left:4px solid var(--ecg);
  display:flex; flex-direction:column; min-height:150px;
  transition:transform .12s ease;
}
.note-card:hover{ transform:translateY(-2px); }
.note-card .nc-top{ display:flex; align-items:flex-start; gap:8px; }
.note-card .nc-title{ font-weight:700; font-size:14.5px; flex:1; line-height:1.3; }
.note-card .nc-pin{ color:var(--resp); flex:none; }
.note-card .nc-body{
  color:var(--text-dim); font-size:12.5px; line-height:1.5; margin-top:6px;
  flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical;
}
.nc-tags{ display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
.nc-tags .badge{ font-size:10px; padding:2px 7px; border-radius:100px; font-weight:700; }
.nc-foot{
  display:flex; align-items:center; justify-content:space-between;
  margin-top:10px; padding-top:8px; border-top:1px solid var(--line);
  font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint);
}
.nc-actions{ display:flex; gap:2px; }

.badge{ display:inline-block; }
.badge-writ{ background:rgba(34,211,238,.15); color:var(--spo2); }
.badge-viva{ background:rgba(183,156,255,.15); color:var(--violet); }
.badge-ospe{ background:rgba(255,209,102,.15); color:var(--resp); }
.badge-long{ background:rgba(57,255,136,.15); color:var(--ecg); }
.badge-short{ background:rgba(251,95,118,.15); color:var(--art); }
.badge-must{ background:rgba(251,95,118,.18); color:var(--art); }
.badge-yield{ background:rgba(255,209,102,.18); color:var(--resp); }
.badge-hard{ background:rgba(183,156,255,.18); color:var(--violet); }

.empty{
  text-align:center; padding:70px 20px; color:var(--text-faint);
}
.empty svg{ opacity:.5; margin-bottom:10px; }

/* ---------- Editor ---------- */
.editor-overlay{
  position:fixed; inset:0; background:rgba(3,8,14,.6);
  display:none; align-items:flex-start; justify-content:center;
  padding:30px 16px; z-index:60; overflow-y:auto;
  backdrop-filter: blur(2px);
}
.editor-overlay.show{ display:flex; }
.editor{
  background:var(--bg-elevated); border:1px solid var(--line);
  border-radius:var(--radius-l); width:100%; max-width:760px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.6);
  display:flex; flex-direction:column; max-height:90vh;
}
.editor-head{
  display:flex; align-items:center; gap:10px; padding:14px 16px;
  border-bottom:1px solid var(--line);
}
.editor-head input.title{
  flex:1; background:none; border:none; outline:none; color:var(--text);
  font-size:19px; font-weight:800;
}
.autosave-flag{
  font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint);
  display:flex; align-items:center; gap:5px; white-space:nowrap;
}
.autosave-flag .dot{ width:6px; height:6px; border-radius:50%; background:var(--ecg); }

.toolbar{
  display:flex; align-items:center; gap:4px; flex-wrap:wrap;
  padding:8px 12px; border-bottom:1px solid var(--line);
  background:var(--bg-card);
}
.toolbar select{
  background:var(--bg-elevated); color:var(--text); border:1px solid var(--line);
  border-radius:6px; padding:5px 6px; font-size:12px;
}
.toolbar button{
  background:none; border:none; color:var(--text-dim); cursor:pointer;
  width:30px; height:30px; border-radius:6px; display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:13px;
}
.toolbar button:hover{ background:var(--bg-elevated); color:var(--text); }
.toolbar .sep{ width:1px; height:20px; background:var(--line); margin:0 4px; }
.toolbar input[type="color"]{
  width:26px; height:26px; border:none; background:none; padding:0; cursor:pointer;
}

.editor-body{ flex:1; overflow-y:auto; padding:16px; }
.editable{
  min-height:220px; outline:none; line-height:1.7;
  font-family:var(--note-font); font-size:var(--note-size); font-weight:var(--note-weight);
}
.editable mark{ background:var(--resp); color:var(--on-resp); border-radius:2px; }

.editor-meta{
  padding:12px 16px; border-top:1px solid var(--line);
  display:flex; flex-wrap:wrap; gap:10px; align-items:center;
}
.meta-field{ display:flex; align-items:center; gap:6px; }
.meta-field label{ font-size:11px; color:var(--text-faint); font-family:var(--font-mono); }
.meta-field select, .meta-field input[type="text"]{
  background:var(--bg-card); border:1px solid var(--line); color:var(--text);
  border-radius:6px; padding:6px 8px; font-size:12.5px;
}
.exam-tags{ display:flex; flex-wrap:wrap; gap:6px; }
.exam-tag-btn{
  font-size:11px; padding:5px 10px; border-radius:100px; cursor:pointer;
  border:1px solid var(--line); background:var(--bg-card); color:var(--text-dim); font-weight:700;
}
.exam-tag-btn.on{ color:var(--on-ecg); border-color:transparent; }
.exam-tag-btn[data-tag="Written"].on{ background:var(--spo2); color:var(--on-spo2); }
.exam-tag-btn[data-tag="Viva"].on{ background:var(--violet); color:var(--on-violet); }
.exam-tag-btn[data-tag="OSPE"].on{ background:var(--resp); color:var(--on-resp); }
.exam-tag-btn[data-tag="Long Case"].on{ background:var(--ecg); color:var(--on-ecg); }
.exam-tag-btn[data-tag="Short Case"].on{ background:var(--art); color:var(--on-art); }
.exam-tag-btn[data-tag="Must-Know"].on{ background:var(--art); color:var(--on-art); }
.exam-tag-btn[data-tag="High-Yield"].on{ background:var(--resp); color:var(--on-resp); }
.exam-tag-btn[data-tag="Hard Topic"].on{ background:var(--violet); color:var(--on-violet); }

.editor-foot{
  padding:12px 16px; border-top:1px solid var(--line);
  display:flex; justify-content:space-between; align-items:center;
}
.editor-foot .left-actions{ display:flex; gap:6px; }

.toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--bg-elevated); border:1px solid var(--line); color:var(--text);
  padding:10px 18px; border-radius:100px; font-size:13px; box-shadow:var(--shadow-card);
  opacity:0; pointer-events:none; transition:.2s ease; z-index:100;
  display:flex; align-items:center; gap:8px;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
.toast .dot{ width:7px; height:7px; border-radius:50%; background:var(--ecg); }

.modal-overlay{
  position:fixed; inset:0; background:rgba(3,8,14,.6); z-index:70;
  display:none; align-items:center; justify-content:center; padding:16px;
}
.modal-overlay.show{ display:flex; }
.modal{
  background:var(--bg-elevated); border:1px solid var(--line); border-radius:var(--radius-l);
  width:100%; max-width:340px; padding:18px;
}
.modal h3{ margin:0 0 12px; font-size:15px; }
.modal input, .modal select{
  width:100%; background:var(--bg-card); border:1px solid var(--line); color:var(--text);
  border-radius:8px; padding:9px 10px; font-size:13.5px; margin-bottom:10px;
}
.color-row{ display:flex; gap:8px; margin-bottom:14px; }
.color-swatch{
  width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid transparent;
}
.color-swatch.sel{ border-color:var(--text); }
.modal-actions{ display:flex; justify-content:flex-end; gap:8px; }

::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-thumb{ background:var(--line); border-radius:10px; }
::-webkit-scrollbar-track{ background:transparent; }

/* ============================================================
   Phase 2 — Study Planner (Today / Week / Month / Timetable)
   ============================================================ */

.mode-switch{
  display:flex; gap:4px; margin:0 16px 6px; padding:3px;
  background:var(--bg-card); border:1px solid var(--line); border-radius:100px;
}
.mode-switch button{
  flex:1; border:none; background:none; color:var(--text-dim); cursor:pointer;
  padding:7px 10px; border-radius:100px; font-size:12.5px; font-weight:700;
  display:flex; align-items:center; justify-content:center; gap:6px;
}
.mode-switch button.active{ background:var(--ecg); color:var(--on-ecg); }

.planner-tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
.planner-tab{
  border:1px solid var(--line); background:var(--bg-card); color:var(--text-dim);
  padding:7px 14px; border-radius:100px; font-size:12.5px; font-weight:700; cursor:pointer;
}
.planner-tab.active{ background:var(--spo2); color:var(--on-spo2); border-color:transparent; }

.quick-add{
  display:flex; gap:8px; flex-wrap:wrap; align-items:center;
  background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius-m);
  padding:10px 12px; margin-bottom:16px;
}
.quick-add input[type="text"]{
  flex:1; min-width:140px; background:none; border:none; outline:none; color:var(--text); font-size:13.5px;
}
.quick-add input[type="time"], .quick-add input[type="date"]{
  background:var(--bg-elevated); border:1px solid var(--line); color:var(--text-dim);
  border-radius:6px; padding:6px 8px; font-size:12px; font-family:var(--font-mono);
}
.quick-add button{
  background:var(--ecg); border:none; color:var(--on-ecg); font-weight:800;
  padding:7px 14px; border-radius:8px; cursor:pointer; font-size:12.5px;
}

.task-row{
  display:flex; align-items:center; gap:10px;
  background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius-s);
  padding:9px 12px; margin-bottom:7px;
}
.task-row.done{ opacity:.5; }
.task-row.done .task-title{ text-decoration:line-through; }
.task-check{
  width:19px; height:19px; border-radius:6px; border:2px solid var(--line); flex:none;
  cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--ecg);
  background:var(--bg-elevated);
}
.task-check.on{ background:var(--ecg); border-color:var(--ecg); color:var(--on-ecg); }
.task-title{ flex:1; font-size:13.5px; }
.task-meta{ display:flex; gap:8px; align-items:center; font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); flex-wrap:wrap; }
.task-topic{ background:var(--bg-elevated); padding:2px 8px; border-radius:100px; color:var(--text-dim); }
.task-del{ background:none; border:none; color:var(--text-faint); cursor:pointer; padding:4px; border-radius:6px; }
.task-del:hover{ color:var(--art); background:var(--bg-elevated); }

.today-progress{
  display:flex; align-items:center; gap:10px; margin-bottom:14px;
}
.today-progress .bar{
  flex:1; height:7px; border-radius:100px; background:var(--bg-card); border:1px solid var(--line); overflow:hidden;
}
.today-progress .fill{ height:100%; background:var(--ecg); border-radius:100px; }
.today-progress .num{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-faint); white-space:nowrap; }

.week-nav, .month-nav{
  display:flex; align-items:center; gap:10px; margin-bottom:14px;
}
.week-nav button, .month-nav button{
  background:var(--bg-card); border:1px solid var(--line); color:var(--text); width:30px; height:30px;
  border-radius:8px; cursor:pointer;
}
.week-nav .label, .month-nav .label{ font-weight:700; font-size:13.5px; font-family:var(--font-mono); }

.week-grid{
  display:grid; grid-template-columns:repeat(7,minmax(140px,1fr)); gap:10px; overflow-x:auto;
}
.day-col{
  background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius-m);
  padding:10px; min-height:120px;
}
.day-col.today{ border-color:var(--ecg); box-shadow:0 0 0 1px var(--ecg) inset; }
.day-col-head{
  font-size:11.5px; font-weight:800; color:var(--text-dim); margin-bottom:8px;
  display:flex; justify-content:space-between; font-family:var(--font-mono);
}
.day-col .add-mini{
  width:100%; background:none; border:1px dashed var(--line); color:var(--text-faint);
  border-radius:6px; padding:6px; font-size:11.5px; cursor:pointer; margin-top:4px;
}
.day-col .add-mini:hover{ color:var(--text); border-color:var(--text-faint); }

.cal-grid{
  display:grid; grid-template-columns:repeat(7,1fr); gap:6px;
}
.cal-dow{
  text-align:center; font-size:10.5px; color:var(--text-faint); font-family:var(--font-mono);
  padding-bottom:4px; font-weight:700;
}
.cal-cell{
  min-height:52px; aspect-ratio:1/0.85; background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius-s);
  padding:6px; cursor:pointer; position:relative; display:flex; flex-direction:column;
}
.cal-cell.outside{ opacity:.35; }
.cal-cell.today{ border-color:var(--ecg); }
.cal-cell.selected{ box-shadow:0 0 0 2px var(--spo2) inset; }
.cal-cell .dnum{ font-size:12px; font-weight:700; font-family:var(--font-mono); }
.cal-cell .dots{ display:flex; gap:3px; margin-top:auto; flex-wrap:wrap; }
.cal-cell .dots span{ width:6px; height:6px; border-radius:50%; background:var(--resp); }

.day-panel{
  margin-top:16px; background:var(--bg-card); border:1px solid var(--line);
  border-radius:var(--radius-m); padding:14px;
}
.day-panel h3{ margin:0 0 10px; font-size:14px; font-family:var(--font-mono); color:var(--text-dim); }

.timetable-grid{
  display:grid; grid-template-columns:repeat(7,minmax(130px,1fr)); gap:10px; overflow-x:auto;
}
.tt-col{
  background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius-m); padding:10px;
  min-height:140px;
}
.tt-col-head{ font-size:12px; font-weight:800; margin-bottom:8px; font-family:var(--font-mono); }
.slot-chip{
  border-radius:8px; padding:7px 9px; margin-bottom:7px; font-size:11.5px;
  border-left:3px solid var(--ecg); background:var(--bg-elevated); position:relative;
}
.slot-chip .st{ font-family:var(--font-mono); font-size:10px; color:var(--text-faint); }
.slot-chip .sub{ font-weight:700; margin-top:2px; }
.slot-chip .del{
  position:absolute; top:4px; right:4px; background:none; border:none; color:var(--text-faint);
  cursor:pointer; font-size:11px; padding:2px;
}
.slot-chip .del:hover{ color:var(--art); }
.tt-col .add-mini{
  width:100%; background:none; border:1px dashed var(--line); color:var(--text-faint);
  border-radius:6px; padding:6px; font-size:11px; cursor:pointer;
}

/* ============================================================
   Phase 3 — Revision system (last-night list + activity chart)
   ============================================================ */

.revise-tab{
  border:1px solid var(--line); background:var(--bg-card); color:var(--text-dim);
  padding:7px 14px; border-radius:100px; font-size:12.5px; font-weight:700; cursor:pointer;
}
.revise-tab.active{ background:var(--art); color:var(--on-art); border-color:transparent; }

.rev-filters{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
.rev-filter{
  border:1px solid var(--line); background:var(--bg-card); color:var(--text-dim);
  padding:5px 11px; border-radius:100px; font-size:11.5px; font-weight:700; cursor:pointer;
}
.rev-filter.on{ background:var(--resp); color:var(--on-resp); border-color:transparent; }
.rev-filter .n{ opacity:.65; margin-left:5px; font-family:var(--font-mono); font-size:10px; }

.rev-summary{
  display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;
}
.rev-stat{
  background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius-m);
  padding:10px 14px; flex:1; min-width:120px;
}
.rev-stat .v{ font-size:22px; font-weight:800; font-family:var(--font-mono); line-height:1.1; }
.rev-stat .k{ font-size:10.5px; color:var(--text-faint); margin-top:3px; }

.rev-item{
  background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius-m);
  margin-bottom:8px; overflow:hidden; border-left:4px solid var(--art);
}
.rev-head{
  display:flex; align-items:center; gap:10px; padding:11px 13px; cursor:pointer;
}
.rev-head .t{ flex:1; font-weight:700; font-size:13.5px; line-height:1.3; }
.rev-age{
  font-family:var(--font-mono); font-size:10px; color:var(--text-faint); white-space:nowrap;
}
.rev-age.stale{ color:var(--art); }
.rev-badges{ display:flex; flex-wrap:wrap; gap:4px; padding:0 13px 9px; }
.rev-body{
  display:none; padding:2px 13px 13px; line-height:1.7;
  font-family:var(--note-font); font-size:var(--note-size);
  border-top:1px solid var(--line); margin-top:2px; padding-top:11px;
}
.rev-item.open .rev-body{ display:block; }
.rev-body mark{ background:var(--resp); color:var(--on-resp); border-radius:2px; }
.rev-actions{ display:flex; gap:7px; padding:0 13px 12px; flex-wrap:wrap; }
.rev-actions button{
  border:1px solid var(--line); background:var(--bg-elevated); color:var(--text-dim);
  border-radius:7px; padding:6px 11px; font-size:11.5px; font-weight:700; cursor:pointer;
}
.rev-actions button.mark{ background:var(--ecg); color:var(--on-ecg); border-color:transparent; }

.chart-card{
  background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius-m);
  padding:14px; margin-bottom:14px;
}
.chart-card h3{ margin:0 0 3px; font-size:13.5px; }
.chart-card .hint{ font-size:11px; color:var(--text-faint); margin:0 0 12px; font-family:var(--font-mono); }
.chart-svg{ width:100%; height:auto; display:block; overflow:visible; }

.topic-bar{ margin-bottom:9px; }
.topic-bar .lbl{
  display:flex; justify-content:space-between; font-size:11.5px; margin-bottom:4px; color:var(--text-dim);
}
.topic-bar .lbl .c{ font-family:var(--font-mono); color:var(--text-faint); }
.topic-bar .track{ height:8px; background:var(--bg-elevated); border-radius:100px; overflow:hidden; }
.topic-bar .fill{ height:100%; border-radius:100px; }

/* ============================================================
   Phase 4 — Export & Share (print / PDF output)
   ============================================================ */

#printArea{ display:none; }

@media print{
  /* hide the whole app, show only the printable note */
  .app, .editor-overlay, .modal-overlay, .toast, .scrim{ display:none !important; }
  body{ background:#fff !important; background-image:none !important; }

  #printArea{
    display:block;
    color:#111;
    font-family:Georgia, 'Times New Roman', serif;
    font-size:12pt;
    line-height:1.6;
    padding:0;
  }
  #printArea .p-head{
    border-bottom:2px solid #111;
    padding-bottom:8pt; margin-bottom:14pt;
  }
  #printArea h1{ font-size:20pt; margin:0 0 6pt; line-height:1.25; }
  #printArea .p-meta{
    font-family:Arial, Helvetica, sans-serif;
    font-size:9pt; color:#444;
  }
  #printArea .p-badges{ margin-top:6pt; font-family:Arial, Helvetica, sans-serif; font-size:8.5pt; }
  #printArea .p-badges span{
    border:1px solid #666; border-radius:9pt; padding:1.5pt 7pt; margin-right:4pt;
    display:inline-block; color:#222;
  }
  #printArea .p-body mark{ background:#ffe9a8 !important; color:#111 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  #printArea .p-body img{ max-width:100%; }
  #printArea .p-foot{
    margin-top:18pt; padding-top:6pt; border-top:1px solid #bbb;
    font-family:Arial, Helvetica, sans-serif; font-size:8pt; color:#666;
  }
  @page{ margin:16mm; }
}

/* ============================================================
   Phase 5 — Dashboard + Settings
   ============================================================ */

/* 4 modes now: let them wrap two-up instead of squeezing */
.mode-switch{ flex-wrap:wrap; }
.mode-switch button{ flex:1 1 calc(50% - 4px); font-size:12px; padding:7px 6px; }

.hero{
  background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius-l);
  padding:18px 18px 16px; margin-bottom:16px; position:relative; overflow:hidden;
}
.hero::after{
  content:''; position:absolute; right:-40px; top:-40px; width:180px; height:180px;
  border-radius:50%; background:var(--ecg); opacity:.07;
}
.hero .greet{ font-size:13px; color:var(--text-faint); font-family:var(--font-mono); }
.hero .big{ font-size:26px; font-weight:800; margin:5px 0 2px; line-height:1.2; }
.hero .sub{ font-size:12.5px; color:var(--text-dim); }
.hero .countdown{
  display:flex; align-items:baseline; gap:9px; margin-top:12px;
  padding-top:12px; border-top:1px solid var(--line);
}
.hero .countdown .d{ font-size:34px; font-weight:800; font-family:var(--font-mono); color:var(--ecg); line-height:1; }
.hero .countdown .l{ font-size:12.5px; color:var(--text-dim); }
.hero .set-exam{
  margin-top:12px; padding-top:12px; border-top:1px solid var(--line);
  background:none; border:none; border-top:1px solid var(--line); width:100%; text-align:left;
  color:var(--spo2); font-size:12.5px; font-weight:700; cursor:pointer; padding-bottom:0;
}

.stat-grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px; margin-bottom:18px;
}
.stat{
  background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius-m);
  padding:12px 14px; border-left:4px solid var(--line);
}
.stat .v{ font-size:24px; font-weight:800; font-family:var(--font-mono); line-height:1.1; }
.stat .k{ font-size:10.5px; color:var(--text-faint); margin-top:4px; }

.dash-sec{ margin-bottom:20px; }
.dash-sec .hd{
  display:flex; align-items:center; justify-content:space-between; margin-bottom:9px;
}
.dash-sec .hd h3{ margin:0; font-size:14px; font-weight:800; }
.dash-sec .hd button{
  background:none; border:none; color:var(--spo2); font-size:11.5px; font-weight:700;
  cursor:pointer; font-family:var(--font-mono);
}
.mini-note{
  display:flex; align-items:center; gap:10px; padding:9px 12px; cursor:pointer;
  background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius-s);
  margin-bottom:6px; border-left:3px solid var(--ecg);
}
.mini-note .t{ flex:1; font-size:13px; font-weight:700; }
.mini-note .m{ font-family:var(--font-mono); font-size:10px; color:var(--text-faint); white-space:nowrap; }

/* ---- Settings panel ---- */
.modal.wide{ max-width:440px; max-height:88vh; overflow-y:auto; }
.set-group{ margin-bottom:18px; }
.set-group > label{
  display:block; font-size:11px; font-weight:800; color:var(--text-faint);
  font-family:var(--font-mono); margin-bottom:8px;
}
.theme-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:8px; }
.theme-opt{
  border:2px solid var(--line); border-radius:var(--radius-m); padding:8px;
  cursor:pointer; background:none; text-align:left;
}
.theme-opt.sel{ border-color:var(--ecg); }
.theme-opt .swatches{ display:flex; gap:3px; margin-bottom:6px; }
.theme-opt .swatches i{ width:100%; height:16px; border-radius:3px; display:block; }
.theme-opt .nm{ font-size:11.5px; font-weight:700; color:var(--text); }
.theme-opt .ty{ font-size:9.5px; color:var(--text-faint); font-family:var(--font-mono); }
.set-row{ display:flex; gap:8px; }
.set-row > *{ flex:1; }

/* ============================================================
   Phase 6 — status, photos, colourful dashboard, fuller sidebar
   ============================================================ */

/* ---- images inside notes ---- */
.editable img, .rev-body img{
  max-width:100%; height:auto; border-radius:var(--radius-s);
  display:block; margin:10px 0 4px;
}

/* ---- note status ---- */
.status-dot{ width:9px; height:9px; border-radius:50%; flex:none; display:inline-block; }
.st-none{      background:var(--text-faint); }
.st-due{       background:var(--art); }
.st-partial{   background:var(--resp); }
.st-completed{ background:var(--ecg); }

.badge-status{ display:inline-flex; align-items:center; gap:5px; font-size:10px;
  padding:2px 8px; border-radius:100px; font-weight:700;
  background:var(--bg-elevated); color:var(--text-dim); }

/* ---- colourful dashboard ---- */
.stat{ position:relative; overflow:hidden; border-left-width:1px; }
.stat::before{
  content:''; position:absolute; inset:0; opacity:.13; pointer-events:none;
  background:linear-gradient(135deg, var(--c1) 0%, var(--c2) 100%);
}
.stat::after{
  content:''; position:absolute; right:-22px; bottom:-26px;
  width:78px; height:78px; border-radius:50%; background:var(--c1); opacity:.16;
}
.stat > *{ position:relative; z-index:1; }
.stat .v{ color:var(--c1); }
.stat .k{ color:var(--text-dim); font-weight:700; }

.hero{
  /* plain fallback first — older browsers ignore the color-mix rule below */
  background:var(--bg-card);
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--ecg) 14%, var(--bg-card)) 0%,
                            color-mix(in srgb, var(--violet) 12%, var(--bg-card)) 55%,
                            var(--bg-card) 100%);
}
.hero .countdown .d{
  background:linear-gradient(120deg, var(--ecg), var(--spo2));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}

.dash-sec .hd h3{ display:flex; align-items:center; gap:8px; }
.dash-sec .hd h3::before{
  content:''; width:4px; height:16px; border-radius:3px; background:var(--accent, var(--ecg));
}

/* ---- sidebar sections for non-notes modes ---- */
.side-mini{
  margin:0 12px 10px; padding:11px 13px; border-radius:var(--radius-m);
  background:var(--bg-card); border:1px solid var(--line);
}
.side-mini .v{ font-size:20px; font-weight:800; font-family:var(--font-mono); line-height:1.1; }
.side-mini .k{ font-size:10.5px; color:var(--text-faint); margin-top:3px; }
.side-mini.accent{ border-color:var(--ecg); }
.side-mini.accent .v{ color:var(--ecg); }

.side-hint{
  margin:auto 12px 14px; padding:11px 13px; border-radius:var(--radius-m);
  background:var(--bg-card); border:1px dashed var(--line);
  font-size:11.5px; line-height:1.55; color:var(--text-faint);
}
.side-hint b{ color:var(--text-dim); }

/* ---- backup reminder ---- */
.backup-banner{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  background:var(--bg-card); border:1px solid var(--resp);
  border-left:4px solid var(--resp);
  border-radius:var(--radius-m); padding:12px 14px; margin-bottom:16px;
}
.backup-banner .txt{ flex:1; min-width:180px; font-size:12.5px; line-height:1.5; }
.backup-banner .txt b{ display:block; font-size:13.5px; margin-bottom:2px; }
.backup-banner button{
  background:var(--resp); color:var(--on-resp); border:none; border-radius:8px;
  padding:8px 14px; font-size:12.5px; font-weight:800; cursor:pointer;
}
.backup-banner .later{
  background:none; color:var(--text-faint); font-weight:700;
}
.side-dot{
  width:7px; height:7px; border-radius:50%; background:var(--resp);
  display:inline-block; margin-left:5px;
}

</style>
</head>
<body>

<div class="scrim" id="scrim"></div>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg class="pulse" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="74" y="74" width="364" height="212" rx="30" fill="none" stroke="#22D3EE" stroke-width="26"/>
        <polyline points="108,196 176,196 198,132 224,266 248,152 268,196 404,196"
          stroke="#39FF88" stroke-width="26" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="96"  y="316" width="98" height="164" rx="49" fill="#22D3EE"/>
        <rect x="207" y="316" width="98" height="164" rx="49" fill="#39FF88"/>
        <rect x="318" y="316" width="98" height="164" rx="49" fill="#FFD166"/>
      </svg>
      <div>
        <h1>Anaesthesia Vault</h1>
        <span>FCPS exam prep</span>
      </div>
    </div>

    <div class="mode-switch">
      <button id="modeHomeBtn" class="active">🏠 Home</button>
      <button id="modeNotesBtn">📝 Notes</button>
      <button id="modePlannerBtn">🗓 Planner</button>
      <button id="modeReviseBtn">🔥 Revise</button>
    </div>

    <div id="sideBody"></div>

    <div class="sidebar-footer" id="sidebarFooter">
      <button class="btn btn-primary" id="newNoteBtn" style="width:100%;justify-content:center;">+ New note</button>
    </div>
    <div class="sidebar-footer" id="backupBar" style="border-top:none;padding-top:0;">
      <button class="btn btn-ghost" id="exportBtn" style="flex:1;justify-content:center;font-size:11.5px;padding:7px;">⬇ Backup<span class="side-dot" id="backupDot" style="display:none"></span></button>
      <button class="btn btn-ghost" id="importBtn" style="flex:1;justify-content:center;font-size:11.5px;padding:7px;">⬆ Restore</button>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none;">
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <button class="icon-btn menu-toggle" id="menuToggle">☰</button>
      <div class="search-box">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="searchInput" type="text" placeholder="Search title, content, topic, tag…">
      </div>
      <button class="theme-toggle" id="settingsBtn" title="Settings">⚙</button>
    </div>

    <div class="content" id="dashContent"></div>

    <div class="content" id="notesContent" style="display:none;">
      <h2 class="section-title" id="sectionTitle">All notes</h2>
      <p class="section-sub" id="sectionSub"></p>
      <div class="grid" id="grid"></div>
    </div>

    <div class="content" id="plannerContent" style="display:none;">
      <h2 class="section-title" id="plannerTitle">Today</h2>
      <div class="planner-tabs">
        <button class="planner-tab active" data-pview="today">Today</button>
        <button class="planner-tab" data-pview="week">Week</button>
        <button class="planner-tab" data-pview="month">Month</button>
        <button class="planner-tab" data-pview="timetable">Timetable</button>
      </div>
      <div id="plannerBody"></div>
    </div>
    <div class="content" id="reviseContent" style="display:none;">
      <h2 class="section-title" id="reviseTitle">Last-night revision</h2>
      <div class="planner-tabs">
        <button class="revise-tab active" data-rview="list">Revision list</button>
        <button class="revise-tab" data-rview="activity">Activity</button>
      </div>
      <div id="reviseBody"></div>
    </div>
  </main>
</div>

<!-- EDITOR -->
<div class="editor-overlay" id="editorOverlay">
  <div class="editor">
    <div class="editor-head">
      <input class="title" id="titleInput" type="text" placeholder="Note title…">
      <span class="autosave-flag" id="autosaveFlag"><span class="dot"></span>Ready</span>
      <button class="icon-btn" id="closeEditorBtn">✕</button>
    </div>

    <div class="toolbar">
      <select id="fontFamily" title="Font">
        <option value="Plus Jakarta Sans">Sans</option>
        <option value="Georgia">Serif</option>
        <option value="JetBrains Mono">Mono</option>
      </select>
      <select id="fontSize" title="Size">
        <option value="2">S</option>
        <option value="3" selected>M</option>
        <option value="4">L</option>
        <option value="5">XL</option>
        <option value="6">XXL</option>

/* ============================================================
   db.js — tiny IndexedDB wrapper (no external libs, fully offline)
   Stores: notes, folders, settings
   ============================================================ */

const DB_NAME = 'fcps_prep_vault';
const DB_VERSION = 3;
let _db = null;

function openDB(){
  return new Promise((resolve, reject) => {
    if(_db) return resolve(_db);
    const req = indexedDB.open(DB_NAME, DB_VERSION);

    req.onupgradeneeded = (e) => {
      const db = e.target.result;

      if(!db.objectStoreNames.contains('notes')){
        const notes = db.createObjectStore('notes', { keyPath:'id' });
        notes.createIndex('folderId', 'folderId');
        notes.createIndex('updatedAt', 'updatedAt');
        notes.createIndex('pinned', 'pinned');
        notes.createIndex('archived', 'archived');
        notes.createIndex('trashed', 'trashed');
      }
      if(!db.objectStoreNames.contains('folders')){
        db.createObjectStore('folders', { keyPath:'id' });
      }
      if(!db.objectStoreNames.contains('settings')){
        db.createObjectStore('settings', { keyPath:'key' });
      }
      if(!db.objectStoreNames.contains('tasks')){
        const tasks = db.createObjectStore('tasks', { keyPath:'id' });
        tasks.createIndex('date', 'date');
      }
      if(!db.objectStoreNames.contains('slots')){
        const slots = db.createObjectStore('slots', { keyPath:'id' });
        slots.createIndex('day', 'day');
      }
      if(!db.objectStoreNames.contains('activity')){
        const act = db.createObjectStore('activity', { keyPath:'id' });
        act.createIndex('date', 'date');
      }
    };

    req.onsuccess = (e) => { _db = e.target.result; resolve(_db); };
    req.onerror = (e) => reject(e.target.error);
  });
}

function tx(storeName, mode='readonly'){
  return openDB().then(db => db.transaction(storeName, mode).objectStore(storeName));
}

const DB = {

  async exportAll(){
    const [notes, folders, tasks, slots, activity] = await Promise.all([

    ]);
    return { app:'anaesthesia-vault', version:1, exportedAt:new Date().toISOString(),
             notes, folders, tasks, slots, activity };
  },

  async importAll({notes=[], folders=[], tasks=[], slots=[], activity=[]}){
    const db = await openDB();
    return new Promise((res, rej) => {
      const t = db.transaction(['notes','folders','tasks','slots','activity'], 'readwrite');
      t.oncomplete = () => res(true);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
      notes.forEach(n => t.objectStore('notes').put(n));
      folders.forEach(f => t.objectStore('folders').put(f));
      tasks.forEach(x => t.objectStore('tasks').put(x));
      slots.forEach(s => t.objectStore('slots').put(s));
      activity.forEach(a => t.objectStore('activity').put(a));
    });
  }
};

const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));

function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('en-GB',{ day:'2-digit', month:'short' }) + ' · ' +
         d.toLocaleTimeString('en-GB',{ hour:'2-digit', minute:'2-digit' });

function plainText(html){
  const d = document.createElement('div');
  d.innerHTML = html || '';
  return d.textContent || '';
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function badgeClass(tag){

}

/* ---------------- Date helpers (week starts Saturday) ---------------- */
function isoDate(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayISO(){ return isoDate(new Date()); }
function addDays(d, n){ const c = new Date(d); c.setDate(c.getDate()+n); return c; }
function dowIndex(d){ return (d.getDay() - state.settings.weekStart + 7) % 7; }
function startOfWeek(d){ return addDays(d, -dowIndex(d)); }
function fmtDayLabel(d){ return d.toLocaleDateString('en-GB',{ day:'2-digit', month:'short' }); }
function fmtMonthLabel(d){ return d.toLocaleDateString('en-GB',{ month:'long', year:'numeric' }); }
function fmtTime12(t){
  if(!t) return '';
  const [h,m] = t.split(':').map(Number);
  const ampm = h>=12?'PM':'AM'; const h12 = ((h+11)%12)+1;
  return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
}

  state.slots   = await DB.getAllSlots();

  if(state.folders.length === 0){
    const seed = [
      {name:'Cardiac Anaesthesia', color:FOLDER_COLORS[0]},
      {name:'Regional & Obstetric', color:FOLDER_COLORS[1]},
      {name:'Critical Care', color:FOLDER_COLORS[2]},
      {name:'Applied Physiology', color:FOLDER_COLORS[3]},
    ];
    for(const f of seed){
      const folder = { id: uid(), name:f.name, color:f.color, createdAt: Date.now() };
      await DB.putFolder(folder);
      state.folders.push(folder);
    }
  }

  await loadSettings();
  await migrateSlots();

  bindGlobalEvents();
  renderSidebar();
  renderGrid();
  switchMode('home');
}

function registerSW(){
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    });
  }
}

/* ---------------- Derived data ---------------- */
function visibleNotes(){
  let list = state.notes.filter(n => {
    if(state.view === 'trash')    return n.trashed;
    if(n.trashed) return false;
    if(state.view === 'archived') return n.archived;
    if(n.archived) return false;
    if(state.view === 'pinned')   return n.pinned;
    if(state.view.startsWith('folder:')) return n.folderId === state.view.slice(7);
    return true; // 'all'
  });

  if(state.statusFilter){
    list = list.filter(n => statusOf(n) === state.statusFilter);
  }
  if(state.tagFilter){
    list = list.filter(n => (n.tags||[]).includes(state.tagFilter) || (n.examTags||[]).includes(state.tagFilter));
  }
  if(state.query.trim()){
    const q = state.query.toLowerCase();
    list = list.filter(n =>
      (n.title||'').toLowerCase().includes(q) ||
      plainText(n.content).toLowerCase().includes(q) ||
      (n.tags||[]).some(t=>t.toLowerCase().includes(q)) ||
      (n.examTags||[]).some(t=>t.toLowerCase().includes(q))
    );
  }
  list.sort((a,b) => {
    if(state.view !== 'trash' && (a.pinned !== b.pinned)) return a.pinned ? -1 : 1;
    return (b.updatedAt||0) - (a.updatedAt||0);
  });
  return list;
}

function allUserTags(){
  const s = new Set();
  state.notes.forEach(n => (n.tags||[]).forEach(t => s.add(t)));
  return Array.from(s).sort();
}

  const live = state.notes.filter(n=>!n.trashed && !n.archived);

  const folderRows = state.folders.map(f => {
    const c = state.notes.filter(n => n.folderId===f.id && !n.trashed && !n.archived).length;
    return `
      <div class="folder-row">
        <button class="side-btn ${state.view==='folder:'+f.id?'active':''}" data-view="folder:${f.id}">
          <span class="folder-dot" style="background:${f.color}"></span>
          ${escapeHtml(f.name)} <span class="count">${c}</span>
        </button>
        <button class="icon-btn" data-del-folder="${f.id}" title="Delete folder">${icon('x')}</button>
      </div>`;
  }).join('');

  const tags = allUserTags();

  body.innerHTML = `
    <div class="side-section">
      <button class="side-btn ${state.view==='all'?'active':''}" data-view="all">
        ${icon('grid')} All notes <span class="count">${counts.all}</span></button>
      <button class="side-btn ${state.view==='pinned'?'active':''}" data-view="pinned">
        ${icon('pin')} Pinned <span class="count">${counts.pinned}</span></button>
      <button class="side-btn ${state.view==='archived'?'active':''}" data-view="archived">
        ${icon('archive')} Archive <span class="count">${counts.archived}</span></button>
      <button class="side-btn ${state.view==='trash'?'active':''}" data-view="trash">
        ${icon('trash')} Trash <span class="count">${counts.trash}</span></button>
    </div>

    <div class="side-section">
      <div class="side-label">Status</div>
      ${STATUSES.map(st=>{
        const c = live.filter(n=>statusOf(n)===st.id).length;
        return `<button class="side-btn ${state.statusFilter===st.id?'active':''}" data-status="${st.id}">
          <span class="status-dot ${st.cls}"></span>${st.label} <span class="count">${c}</span></button>`;
      }).join('')}
    </div>

    <div class="side-section">
      <div class="side-label">Folders <button class="icon-btn" id="addFolderBtn">${icon('plus')}</button></div>
      ${folderRows || '<div style="padding:6px 8px;color:var(--text-faint);font-size:12px;">No folders yet</div>'}
    </div>

    ${tags.length ? `<div class="side-section">
      <div class="side-label">Tags</div>
      <div class="tag-wrap">
        ${tags.map(t=>`<span class="tag-chip ${state.tagFilter===t?'active':''}" data-tag="${escapeHtml(t)}">#${escapeHtml(t)}</span>`).join('')}
      </div></div>` : ''}
  `;

  $$('.side-btn[data-view]', body).forEach(b => b.onclick = () => {
    state.view = b.dataset.view; state.tagFilter = null; state.statusFilter = null;
    renderSidebar(); renderGrid(); closeSidebarMobile();
  });
  $$('[data-status]', body).forEach(b => b.onclick = () => {
    state.statusFilter = state.statusFilter === b.dataset.status ? null : b.dataset.status;
    renderSidebar(); renderGrid(); closeSidebarMobile();
  });
  $$('.tag-chip', body).forEach(c => c.onclick = () => {
    state.tagFilter = state.tagFilter === c.dataset.tag ? null : c.dataset.tag;
    renderSidebar(); renderGrid();
  });
  $$('[data-del-folder]', body).forEach(b => b.onclick = async (e) => {
    e.stopPropagation();
    const id = b.dataset.delFolder;
    if(!confirm('Delete this folder? Notes inside will move to All notes.')) return;
    await DB.deleteFolder(id);
    state.folders = state.folders.filter(f=>f.id!==id);
    const affected = state.notes.filter(n=>n.folderId===id);
    for(const n of affected){ n.folderId = null; await DB.putNote(n); }
    if(state.view === 'folder:'+id) state.view = 'all';
    renderSidebar(); renderGrid();
  });
  $('#addFolderBtn').onclick = () => openFolderModal();
}

/* ---- Home sidebar ---- */
function renderHomeSidebar(body){
  const d = daysUntilExam();
  const todays = state.tasks.filter(t=>t.date===todayISO());
  const due = liveNotes().filter(n => (n.examTags||[]).some(t=>FLAG_TAGS.includes(t)))
                         .filter(n => { const x = daysSince(n.lastRevisedAt); return x===null || x>=7; });
  body.innerHTML = `
    ${d !== null && d >= 0 ? `<div class="side-mini accent"><div class="v">${d}</div><div class="k">days to exam</div></div>` : ''}
    <div class="side-mini"><div class="v">${todays.filter(t=>t.completed).length}/${todays.length}</div><div class="k">today's tasks</div></div>
    <div class="side-mini"><div class="v" style="color:var(--art)">${due.length}</div><div class="k">due for revision</div></div>
    <div class="side-section">
      <button class="side-btn" data-jump="new">${icon('plus')} New note</button>
      <button class="side-btn" data-jump="planner">${icon('grid')} Study planner</button>
      <button class="side-btn" data-jump="revise">${icon('pin')} Revision list</button>
    </div>
  `;
  $$('[data-jump]', body).forEach(b => b.onclick = () => {
    const j = b.dataset.jump;
    if(j==='new') openEditor('new');
    else if(j==='planner'){ switchMode('planner'); switchPView('today'); }
    else { switchMode('revise'); switchRView('list'); }
  });
}

/* ---- Planner sidebar ---- */
function renderPlannerSidebar(body){
  const views = [['today','Today'],['week','Week'],['month','Month'],['timetable','Timetable']];
  const todays = state.tasks.filter(t=>t.date===todayISO());
  const weekDates = new Set(activityWindow().map(w=>w.date));
  const weekDone = state.tasks.filter(t=>t.completed && weekDates.has(t.date)).length;
  body.innerHTML = `
    <div class="side-section">
      <div class="side-label">Planner</div>
      ${views.map(([v,l])=>`<button class="side-btn ${state.pview===v?'active':''}" data-pjump="${v}">${l}</button>`).join('')}
    </div>
    <div class="side-mini accent"><div class="v">${todays.filter(t=>t.completed).length}/${todays.length}</div><div class="k">done today</div></div>
    <div class="side-mini"><div class="v">${weekDone}</div><div class="k">tasks done this week</div></div>
    <div class="side-mini"><div class="v">${state.slots.length}</div><div class="k">timetable slots</div></div>
    <div class="side-hint">Tip: put your fixed routine in <b>Timetable</b>, and only day-specific work in <b>Today</b>.</div>
  `;
  $$('[data-pjump]', body).forEach(b => b.onclick = () => { switchPView(b.dataset.pjump); renderSidebar(); closeSidebarMobile(); });
}

/* ---- Revise sidebar ---- */
function renderReviseSidebar(body){
  const flagged = revisionCandidates('flagged');
  const never = flagged.filter(n=>!n.lastRevisedAt).length;
  body.innerHTML = `
    <div class="side-section">
      <div class="side-label">Revise</div>
      <button class="side-btn ${state.rview==='list'?'active':''}" data-rjump="list">Revision list</button>
      <button class="side-btn ${state.rview==='activity'?'active':''}" data-rjump="activity">Activity</button>
    </div>
    <div class="side-section">
      <div class="side-label">Filter</div>
      ${REV_FILTERS.map(f=>{
        const c = revisionCandidates(f).length;
        if(!c && f!=='flagged') return '';
        return `<button class="side-btn ${state.revFilter===f?'active':''}" data-rfilter="${f}">
          ${f==='flagged'?'All flagged':f} <span class="count">${c}</span></button>`;
      }).join('')}
    </div>
    <div class="side-mini"><div class="v" style="color:var(--art)">${never}</div><div class="k">never revised</div></div>
    <div class="side-hint">The list is sorted oldest-first, so the top is always what you've left longest.</div>
  `;
  $$('[data-rjump]', body).forEach(b => b.onclick = () => { switchRView(b.dataset.rjump); renderSidebar(); closeSidebarMobile(); });
  $$('[data-rfilter]', body).forEach(b => b.onclick = () => {
    state.revFilter = b.dataset.rfilter; state.rview = 'list'; state.revOpenId = null;
    switchRView('list'); renderSidebar(); closeSidebarMobile();
  });
}

/* ---------------- Grid ---------------- */
function viewTitle(){
  if(state.view === 'all') return 'All notes';
  if(state.view === 'pinned') return 'Pinned';
  if(state.view === 'archived') return 'Archive';
  if(state.view === 'trash') return 'Trash';
  if(state.view.startsWith('folder:')){
    const f = state.folders.find(f=>f.id===state.view.slice(7));
    return f ? f.name : 'Folder';
  }
  return 'Notes';
}

function renderGrid(){
  const list = visibleNotes();
  $('#sectionTitle').textContent = viewTitle();
  $('#sectionSub').textContent = state.tagFilter ? `filtered by #${state.tagFilter}` :
    `${list.length} note${list.length===1?'':'s'}`;

  if(list.length === 0){
    $('#grid').innerHTML = `
      <div class="empty" style="grid-column:1/-1">
        ${icon('inbox', 40)}
        <div>${state.view==='trash' ? 'Trash is empty' : 'No notes here yet — tap + New to start'}</div>
      </div>`;
    return;
  }

  $('#grid').innerHTML = list.map(n => {
    const folder = state.folders.find(f=>f.id===n.folderId);
    const preview = escapeHtml(plainText(n.content)).slice(0,160);
    const tags = [...(n.examTags||[]), ...(n.tags||[]).map(t=>'#'+t)];
    return `
    <div class="note-card" style="border-left-color:${folder?folder.color:'var(--ecg)'}" data-open="${n.id}">
      <div class="nc-top">
        <div class="nc-title">${escapeHtml(n.title || 'Untitled')}</div>
        ${n.pinned ? `<span class="nc-pin">${icon('pin',14)}</span>` : ''}
      </div>
      <div class="nc-body">${preview || 'Empty note'}</div>
      <div class="nc-tags">
        <span class="badge badge-status"><i class="status-dot ${statusMeta(statusOf(n)).cls}"></i>${statusMeta(statusOf(n)).label}</span>
        ${(n.examTags||[]).map(t=>`<span class="badge ${badgeClass(t)}">${t}</span>`).join('')}
        ${(n.tags||[]).slice(0,3).map(t=>`<span class="badge" style="background:var(--bg-elevated);color:var(--text-faint)">#${escapeHtml(t)}</span>`).join('')}
      </div>
      <div class="nc-foot">
        <span>${fmtDate(n.updatedAt)}</span>
        <span class="nc-actions">
          ${state.view==='trash' ? `
            <button class="icon-btn" data-restore="${n.id}" title="Restore">${icon('undo',15)}</button>
            <button class="icon-btn" data-purge="${n.id}" title="Delete forever">${icon('x',15)}</button>
          ` : `
            <button class="icon-btn" data-pin="${n.id}" title="Pin">${icon('pin',15)}</button>
            <button class="icon-btn" data-archive="${n.id}" title="Archive">${icon('archive',15)}</button>
            <button class="icon-btn" data-trash="${n.id}" title="Move to trash">${icon('trash',15)}</button>
          `}
        </span>
      </div>
    </div>`;
  }).join('');

  $$('[data-open]').forEach(el => el.addEventListener('click', (e) => {
    if(e.target.closest('[data-pin],[data-archive],[data-trash],[data-restore],[data-purge]')) return;
    openEditor(el.dataset.open);
  }));
  $$('[data-pin]').forEach(b => b.onclick = (e)=>{ e.stopPropagation(); toggleField(b.dataset.pin,'pinned'); });
  $$('[data-archive]').forEach(b => b.onclick = (e)=>{ e.stopPropagation(); toggleField(b.dataset.archive,'archived'); });
  $$('[data-trash]').forEach(b => b.onclick = (e)=>{ e.stopPropagation(); moveToTrash(b.dataset.trash); });
  $$('[data-restore]').forEach(b => b.onclick = (e)=>{ e.stopPropagation(); restoreNote(b.dataset.restore); });
  $$('[data-purge]').forEach(b => b.onclick = (e)=>{ e.stopPropagation(); purgeNote(b.dataset.purge); });
}

async function toggleField(id, field){
  const n = state.notes.find(n=>n.id===id); if(!n) return;
  n[field] = !n[field];
  n.updatedAt = Date.now();
  await DB.putNote(n);
  renderSidebar(); renderGrid();
}
async function moveToTrash(id){
  const n = state.notes.find(n=>n.id===id); if(!n) return;
  n.trashed = true; n.pinned = false; n.updatedAt = Date.now();
  await DB.putNote(n);
  renderSidebar(); renderGrid();
  toast('Moved to trash');
}
async function restoreNote(id){
  const n = state.notes.find(n=>n.id===id); if(!n) return;
  n.trashed = false; n.updatedAt = Date.now();
  await DB.putNote(n);
  renderSidebar(); renderGrid();
  toast('Restored');
}
async function purgeNote(id){
  if(!confirm('Delete this note permanently? This cannot be undone.')) return;
  await DB.deleteNoteHard(id);
  state.notes = state.notes.filter(n=>n.id!==id);
  renderSidebar(); renderGrid();
  toast('Deleted permanently');
}

/* ============================================================
   Phase 2 — Study Planner
   ============================================================ */

function switchMode(mode){
  state.mode = mode;
  const modes = { home:'#modeHomeBtn', notes:'#modeNotesBtn', planner:'#modePlannerBtn', revise:'#modeReviseBtn' };
  Object.entries(modes).forEach(([m,sel]) => $(sel).classList.toggle('active', mode===m));
  $('#dashContent').style.display    = mode==='home'    ? '' : 'none';
  $('#notesContent').style.display   = mode==='notes'   ? '' : 'none';
  $('#plannerContent').style.display = mode==='planner' ? '' : 'none';
  $('#reviseContent').style.display  = mode==='revise'  ? '' : 'none';
  $('#sidebarFooter').style.display  = mode==='notes' ? '' : 'none';
  renderSidebar();
  if(mode==='home') renderDashboard();
  else if(mode==='planner') renderPlannerBody();
  else if(mode==='revise') renderReviseBody();
  else renderGrid();
  closeSidebarMobile();
}

function switchPView(view){
  state.pview = view;
  $$('.planner-tab').forEach(b => b.classList.toggle('active', b.dataset.pview===view));
  const titles = { today:'Today', week:'This Week', month:'This Month', timetable:'Weekly Timetable' };
  $('#plannerTitle').textContent = titles[view] || 'Planner';
  renderPlannerBody();
}

function renderPlannerBody(){
  if(state.pview==='today') return renderToday();
  if(state.pview==='week') return renderWeek();
  if(state.pview==='month') return renderMonth();
  if(state.pview==='timetable') return renderTimetable();
}

/* ---- Today ---- */
function renderToday(){
  const list = state.tasks.filter(t=>t.date===todayISO())
    .sort((a,b)=> (a.time||'99:99').localeCompare(b.time||'99:99'));
  const done = list.filter(t=>t.completed).length;
  const pct = list.length ? Math.round(done/list.length*100) : 0;

  $('#plannerBody').innerHTML = `
    <div class="quick-add">
      <input type="text" id="qaTitle" placeholder="Add today's task — e.g. Revise spinal anaesthesia">
      <input type="time" id="qaTime">
      <input type="text" id="qaTopic" placeholder="Topic" style="max-width:110px;">
      <button id="qaAdd">${icon('plus',14)} Add</button>
    </div>
    <div class="today-progress">
      <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
      <span class="num">${done}/${list.length} done</span>
    </div>
    <div id="taskList">
      ${list.length ? list.map(taskRowHTML).join('') : `<div class="empty">${icon('inbox',34)}<div>No tasks for today yet</div></div>`}
    </div>
  `;
  bindTaskRowEvents();
  $('#qaAdd').onclick = async () => {
    const title = $('#qaTitle').value.trim();
    if(!title) return;
    await addTask({ title, date: todayISO(), time: $('#qaTime').value || '', topic: $('#qaTopic').value.trim() });
    renderToday();
  };
  $('#qaTitle').onkeydown = (e) => { if(e.key==='Enter') $('#qaAdd').click(); };
}

function taskRowHTML(t){
  return `
    <div class="task-row ${t.completed?'done':''}" data-task="${t.id}">
      <button class="task-check ${t.completed?'on':''}" data-toggle="${t.id}">${t.completed?icon('check',12):''}</button>
      <div style="flex:1;">
        <div class="task-title">${escapeHtml(t.title)}</div>
        <div class="task-meta">
          ${t.time ? `<span>${fmtTime12(t.time)}</span>` : ''}
          ${t.topic ? `<span class="task-topic">${escapeHtml(t.topic)}</span>` : ''}
        </div>
      </div>
      <button class="task-del" data-deltask="${t.id}">${icon('x',15)}</button>
    </div>`;
}
function bindTaskRowEvents(){
  $$('[data-toggle]').forEach(b => b.onclick = () => toggleTask(b.dataset.toggle));
  $$('[data-deltask]').forEach(b => b.onclick = () => removeTask(b.dataset.deltask));
}
async function addTask(partial){
  const t = {
    id: uid(), title: partial.title, date: partial.date, time: partial.time||'',
    topic: partial.topic||'', completed:false, createdAt: Date.now(), updatedAt: Date.now()
  };
  await DB.putTask(t);
  state.tasks.push(t);
  return t;
}
async function toggleTask(id){
  const t = state.tasks.find(t=>t.id===id); if(!t) return;
  t.completed = !t.completed; t.updatedAt = Date.now();
  await DB.putTask(t);
  if(t.completed) await logActivity('task', t.topic || 'General');
  refreshCurrentView();
}
async function removeTask(id){
  await DB.deleteTask(id);
  state.tasks = state.tasks.filter(t=>t.id!==id);
  refreshCurrentView();
}

function refreshCurrentView(){
  if(state.mode === 'home') renderDashboard();
  else if(state.mode === 'planner') renderPlannerBody();
  else if(state.mode === 'revise') renderReviseBody();
  else { renderSidebar(); renderGrid(); }
}

/* ---- Week ---- */
function renderWeek(){
  const start = addDays(startOfWeek(new Date()), state.weekOffset*7);
  const days = Array.from({length:7}, (_,i)=>addDays(start,i));
  const label = `${fmtDayLabel(days[0])} – ${fmtDayLabel(days[6])}`;

  $('#plannerBody').innerHTML = `
    <div class="week-nav">
      <button id="weekPrev">${icon('chevL',14)}</button>
      <span class="label">${label}</span>
      <button id="weekNext">${icon('chevR',14)}</button>
      ${state.weekOffset!==0 ? `<button class="btn btn-ghost" id="weekToday" style="padding:5px 10px;">This week</button>` : ''}
    </div>
    <div class="week-grid">
      ${days.map(d=>{
        const iso = isoDate(d);
        const dayTasks = state.tasks.filter(t=>t.date===iso).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
        const isToday = iso===todayISO();
        return `
        <div class="day-col ${isToday?'today':''}">
          <div class="day-col-head"><span>${dowLabels()[dowIndex(d)]}</span><span>${fmtDayLabel(d)}</span></div>
          ${dayTasks.map(t=>`
            <div class="task-row ${t.completed?'done':''}" data-task="${t.id}" style="padding:6px 8px;">
              <button class="task-check ${t.completed?'on':''}" data-toggle="${t.id}" style="width:16px;height:16px;">${t.completed?icon('check',10):''}</button>
              <div style="flex:1;">
                <div class="task-title" style="font-size:12px;">${escapeHtml(t.title)}</div>
                ${t.time ? `<div class="task-meta"><span>${fmtTime12(t.time)}</span></div>` : ''}
              </div>
              <button class="task-del" data-deltask="${t.id}">${icon('x',12)}</button>
            </div>`).join('')}
          <button class="add-mini" data-addday="${iso}">+ add</button>
        </div>`;
      }).join('')}
    </div>
  `;
  bindTaskRowEvents();
  $('#weekPrev').onclick = () => { state.weekOffset--; renderWeek(); };
  $('#weekNext').onclick = () => { state.weekOffset++; renderWeek(); };
  if($('#weekToday')) $('#weekToday').onclick = () => { state.weekOffset=0; renderWeek(); };
  $$('[data-addday]').forEach(b => b.onclick = () => openTaskModal(b.dataset.addday));
}

/* ---- Month (calendar grid) ---- */
function renderMonth(){
  const cursor = state.monthCursor;
  const firstOfMonth = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
  const gridStart = addDays(firstOfMonth, -dowIndex(firstOfMonth));
  const cells = Array.from({length:42}, (_,i)=>addDays(gridStart,i));
  const todayIso = todayISO();

  const tasksByDate = {};
  state.tasks.forEach(t => {
    if(!tasksByDate[t.date]) tasksByDate[t.date] = [];
    tasksByDate[t.date].push(t);
  });

  $('#plannerBody').innerHTML = `
    <div class="month-nav">
      <button id="monthPrev">${icon('chevL',14)}</button>
      <span class="label">${fmtMonthLabel(cursor)}</span>
      <button id="monthNext">${icon('chevR',14)}</button>
    </div>
    <div class="cal-grid">
      ${dowLabels().map(l=>`<div class="cal-dow">${l}</div>`).join('')}
      ${cells.map(d=>{
        const iso = isoDate(d);
        const outside = d.getMonth()!==cursor.getMonth();
        const count = (tasksByDate[iso]||[]).length;
        return `
        <div class="cal-cell ${outside?'outside':''} ${iso===todayIso?'today':''} ${state.selectedDate===iso?'selected':''}" data-date="${iso}">
          <span class="dnum">${d.getDate()}</span>
          <div class="dots">${Array.from({length:Math.min(count,4)}).map(()=>'<span></span>').join('')}</div>
        </div>`;
      }).join('')}
    </div>
    <div id="dayPanelWrap"></div>
  `;
  $('#monthPrev').onclick = () => { state.monthCursor = new Date(cursor.getFullYear(), cursor.getMonth()-1, 1); renderMonth(); };
  $('#monthNext').onclick = () => { state.monthCursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1); renderMonth(); };
  $$('[data-date]').forEach(c => c.onclick = () => { state.selectedDate = c.dataset.date; renderMonth(); });

  if(state.selectedDate) renderDayPanel(state.selectedDate);
}
function renderDayPanel(iso){
  const list = (state.tasks.filter(t=>t.date===iso)).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
  const d = new Date(iso+'T00:00:00');
  $('#dayPanelWrap').innerHTML = `
    <div class="day-panel">
      <h3>${d.toLocaleDateString('en-GB',{ weekday:'long', day:'2-digit', month:'long' })}</h3>
      <div id="dayPanelTasks">${list.length ? list.map(taskRowHTML).join('') : `<div style="color:var(--text-faint);font-size:13px;">No tasks this day</div>`}</div>
      <button class="btn btn-ghost" id="dayPanelAdd" style="margin-top:10px;">${icon('plus',13)} Add task for this day</button>
    </div>
  `;
  bindTaskRowEvents();
  $('#dayPanelAdd').onclick = () => openTaskModal(iso);
}

/* ---- Add-task modal (used by Week + Month) ---- */
function openTaskModal(dateIso){
  $('#taskTitleInput').value = '';
  $('#taskDateInput').value = dateIso || todayISO();
  $('#taskTimeInput').value = '';
  $('#taskTopicInput').value = '';
  $('#taskModal').classList.add('show');
  setTimeout(()=>$('#taskTitleInput').focus(),50);
}
async function saveTaskModal(){
  const title = $('#taskTitleInput').value.trim();
  if(!title) return;
  await addTask({
    title, date: $('#taskDateInput').value || todayISO(),
    time: $('#taskTimeInput').value, topic: $('#taskTopicInput').value.trim()
  });
  $('#taskModal').classList.remove('show');
  renderPlannerBody();
}

/* ---- Timetable (recurring weekly routine) ---- */
function renderTimetable(){
  $('#plannerBody').innerHTML = `
    <p class="section-sub" style="margin-bottom:14px;">Your recurring weekly study routine — set once, reuse every week.</p>
    <div class="timetable-grid">
      ${dowLabels().map((label,li)=>{
        const i = (state.settings.weekStart + li) % 7;
        const daySlots = state.slots.filter(s=>s.day===i).sort((a,b)=>a.start.localeCompare(b.start));

async function saveSlotModal(){

async function logActivity(type, topic){
  const entry = { id: uid(), type, topic: topic || 'General', date: todayISO(), ts: Date.now() };
  await DB.putActivity(entry);
  state.activity.push(entry);
}

function switchRView(view){
  state.rview = view;
  $$('.revise-tab').forEach(b => b.classList.toggle('active', b.dataset.rview===view));
  $('#reviseTitle').textContent = view==='list' ? 'Last-night revision' : 'Study activity';
  renderReviseBody();
}
function renderReviseBody(){
  if(state.rview==='list') return renderRevisionList();
  return renderActivity();
}

/* ---- Revision list ---- */
function liveNotes(){ return state.notes.filter(n => !n.trashed); }

function revisionCandidates(filter){
  const pool = liveNotes();
  if(filter === 'flagged') return pool.filter(n => (n.examTags||[]).some(t => FLAG_TAGS.includes(t)));
  return pool.filter(n => (n.examTags||[]).includes(filter));
}

function daysSince(ts){
  if(!ts) return null;
  return Math.floor((Date.now() - ts) / 86400000);
}
function ageLabel(n){
  const d = daysSince(n.lastRevisedAt);
  if(d === null) return { text:'never revised', stale:true };
  if(d === 0) return { text:'revised today', stale:false };
  if(d === 1) return { text:'revised 1d ago', stale:false };
  return { text:`revised ${d}d ago`, stale: d >= 7 };
}

function renderRevisionList(){
  const list = revisionCandidates(state.revFilter)
    .sort((a,b) => (a.lastRevisedAt||0) - (b.lastRevisedAt||0)); // least-recently-revised first

  const flagged = revisionCandidates('flagged');
  const neverRevised = flagged.filter(n => !n.lastRevisedAt).length;
  const revisedToday = liveNotes().filter(n => daysSince(n.lastRevisedAt) === 0).length;

  $('#reviseBody').innerHTML = `
    <div class="rev-summary">
      <div class="rev-stat"><div class="v">${flagged.length}</div><div class="k">flagged for revision</div></div>
      <div class="rev-stat"><div class="v" style="color:var(--art)">${neverRevised}</div><div class="k">never revised</div></div>
      <div class="rev-stat"><div class="v" style="color:var(--ecg)">${revisedToday}</div><div class="k">revised today</div></div>
    </div>

    <div class="rev-filters">
      ${REV_FILTERS.map(f=>{
        const c = revisionCandidates(f).length;
        const label = f==='flagged' ? 'All flagged' : f;
        return `<button class="rev-filter ${state.revFilter===f?'on':''}" data-revfilter="${f}">${label}<span class="n">${c}</span></button>`;
      }).join('')}
    </div>

    <p class="section-sub">Oldest revision first — the top of this list is what you've left longest.</p>

    <div id="revList">
      ${list.length ? list.map(revItemHTML).join('') : `
        <div class="empty">${icon('inbox',34)}
          <div>Nothing tagged here yet. Open a note and tag it Must-Know, High-Yield or Hard Topic.</div>
        </div>`}
    </div>
  `;

  $$('[data-revfilter]').forEach(b => b.onclick = () => {
    state.revFilter = b.dataset.revfilter; state.revOpenId = null; renderRevisionList();
  });
  $$('[data-revtoggle]').forEach(b => b.onclick = () => {
    const id = b.dataset.revtoggle;
    state.revOpenId = state.revOpenId === id ? null : id;
    renderRevisionList();
  });
  $$('[data-markrevised]').forEach(b => b.onclick = (e) => { e.stopPropagation(); markRevised(b.dataset.markrevised); });
  $$('[data-editnote]').forEach(b => b.onclick = (e) => { e.stopPropagation(); openEditor(b.dataset.editnote); });
}

function revItemHTML(n){
  const age = ageLabel(n);
  const open = state.revOpenId === n.id;
  const folder = state.folders.find(f=>f.id===n.folderId);
  return `
    <div class="rev-item ${open?'open':''}" style="border-left-color:${folder?folder.color:'var(--art)'}">
      <div class="rev-head" data-revtoggle="${n.id}">
        <div class="t">${escapeHtml(n.title || 'Untitled')}</div>
        <span class="rev-age ${age.stale?'stale':''}">${age.text}</span>
      </div>
      <div class="rev-badges">
        ${(n.examTags||[]).map(t=>`<span class="badge ${badgeClass(t)}">${t}</span>`).join('')}
        ${folder ? `<span class="badge" style="background:var(--bg-elevated);color:var(--text-faint)">${escapeHtml(folder.name)}</span>` : ''}
      </div>
      ${open ? `
        <div class="rev-body">${n.content || '<span style="color:var(--text-faint)">Empty note</span>'}</div>
        <div class="rev-actions">
          <button class="mark" data-markrevised="${n.id}">✓ Mark revised</button>
          <button data-editnote="${n.id}">Edit note</button>
        </div>` : ''}
    </div>`;
}

async function markRevised(id){
  const n = state.notes.find(n=>n.id===id); if(!n) return;
  n.lastRevisedAt = Date.now();
  await DB.putNote(n);
  const folder = state.folders.find(f=>f.id===n.folderId);
  await logActivity('revise', folder ? folder.name : (n.tags||[])[0] || 'General');
  state.revOpenId = null;
  renderRevisionList();
  toast('Marked as revised');
}

/* ---- Activity chart ---- */
function activityWindow(){
  const days = state.actRange === 'week' ? 7 : 30;
  const out = [];
  for(let i=days-1; i>=0; i--){
    const d = addDays(new Date(), -i);
    out.push({ date: isoDate(d), d });
  }
  return out;
}

function renderActivity(){
  const win = activityWindow();
  const winSet = new Set(win.map(w=>w.date));
  const inWindow = state.activity.filter(a => winSet.has(a.date));

  const byDate = {};
  win.forEach(w => byDate[w.date] = { revise:0, task:0 });
  inWindow.forEach(a => { if(byDate[a.date]) byDate[a.date][a.type] = (byDate[a.date][a.type]||0) + 1; });

  const byTopic = {};
  inWindow.forEach(a => { byTopic[a.topic] = (byTopic[a.topic]||0) + 1; });
  const topics = Object.entries(byTopic).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const topMax = topics.length ? topics[0][1] : 1;

  const totalRev = inWindow.filter(a=>a.type==='revise').length;
  const totalTask = inWindow.filter(a=>a.type==='task').length;
  const activeDays = win.filter(w => byDate[w.date].revise + byDate[w.date].task > 0).length;

  $('#reviseBody').innerHTML = `
    <div class="planner-tabs">
      <button class="planner-tab ${state.actRange==='week'?'active':''}" data-actrange="week">Week</button>
      <button class="planner-tab ${state.actRange==='month'?'active':''}" data-actrange="month">Month</button>
    </div>

    <div class="rev-summary">
      <div class="rev-stat"><div class="v" style="color:var(--ecg)">${totalRev}</div><div class="k">revisions done</div></div>
      <div class="rev-stat"><div class="v" style="color:var(--spo2)">${totalTask}</div><div class="k">tasks completed</div></div>
      <div class="rev-stat"><div class="v">${activeDays}/${win.length}</div><div class="k">days studied</div></div>
    </div>

    <div class="chart-card">
      <h3>Daily activity</h3>
      <p class="hint">green = revisions · blue = tasks completed</p>
      ${dailyChartSVG(win, byDate)}
    </div>

    <div class="chart-card">
      <h3>Topic-wise breakdown</h3>
      <p class="hint">where your ${state.actRange === 'week' ? 'last 7 days' : 'last 30 days'} went</p>
      ${topics.length ? topics.map(([name,count],i)=>`
        <div class="topic-bar">
          <div class="lbl"><span>${escapeHtml(name)}</span><span class="c">${count}</span></div>
          <div class="track"><div class="fill" style="width:${Math.round(count/topMax*100)}%;background:${FOLDER_COLORS[i%FOLDER_COLORS.length]}"></div></div>
        </div>`).join('')
        : `<div style="color:var(--text-faint);font-size:12.5px;">No activity yet. Tick off a task or mark a note revised, and it shows up here.</div>`}
    </div>
  `;

  $$('[data-actrange]').forEach(b => b.onclick = () => { state.actRange = b.dataset.actrange; renderActivity(); });
}

function dailyChartSVG(win, byDate){
  const W = 100, H = 34, n = win.length;
  const gap = n > 10 ? 0.5 : 1.4;
  const bw = (W - gap*(n-1)) / n;
  const max = Math.max(1, ...win.map(w => byDate[w.date].revise + byDate[w.date].task));

  const bars = win.map((w,i)=>{
    const x = i*(bw+gap);
    const r = byDate[w.date].revise, t = byDate[w.date].task;
    const hr = (r/max)*(H-6), ht = (t/max)*(H-6);
    let out = '';
    if(t) out += `<rect x="${x}" y="${H-6-ht}" width="${bw}" height="${ht}" fill="var(--spo2)" rx="0.6"/>`;
    if(r) out += `<rect x="${x}" y="${H-6-ht-hr}" width="${bw}" height="${hr}" fill="var(--ecg)" rx="0.6"/>`;
    if(!r && !t) out += `<rect x="${x}" y="${H-6.7}" width="${bw}" height="0.7" fill="var(--line)" rx="0.35"/>`;
    return out;
  }).join('');

  // label every day for a week, every 5th for a month
  const step = n > 10 ? 5 : 1;
  const labels = win.map((w,i)=>{
    if(i % step !== 0 && i !== n-1) return '';
    const x = i*(bw+gap) + bw/2;
    const txt = n > 10 ? String(w.d.getDate()) : dowLabels()[dowIndex(w.d)][0];
    return `<text x="${x}" y="${H-1}" font-size="2.6" fill="var(--text-faint)" text-anchor="middle" font-family="monospace">${txt}</text>`;
  }).join('');

  return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${bars}${labels}</svg>`;
}
